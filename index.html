    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniFit Microgames</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* This launcher is a plain scrolling page, not a game screen, so it
           opts out of the no-scroll/absolute-position game shell in theme.css. */
        body { overflow-y: auto; }
        .launcher {
            min-height: 100%;
            display: flex; flex-direction: column; align-items: center;
            padding: clamp(24px, 6vmin, 56px) clamp(16px, 4vmin, 32px);
        }
        .launcher-top {
            width: min(94vw, 920px);
            display: flex; align-items: center; gap: var(--cf-space-3);
            margin-bottom: var(--cf-space-6);
        }
        .launcher-brand {
            display: flex; align-items: center; gap: var(--cf-space-2);
            min-width: 0;
            color: var(--cf-cyan-400);
        }
        .launcher-brand svg { width: 28px; height: 28px; flex-shrink: 0; }
        .launcher-brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .launcher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: clamp(12px, 2.5vmin, 24px);
            width: min(94vw, 920px);
            margin-top: var(--cf-space-8);
        }
        .game-card {
            display: flex; align-items: center; justify-content: center;
            background: var(--cf-gradient-panel);
            border: 1px solid var(--cf-border-soft);
            border-radius: var(--cf-radius-lg);
            box-shadow: var(--cf-shadow-panel);
            padding: var(--cf-space-8) var(--cf-space-6);
            text-decoration: none; color: inherit;
            font-size: var(--cf-type-h2); font-weight: 800; text-align: center;
            transition: transform var(--cf-motion-base) var(--cf-ease-standard),
                        border-color var(--cf-motion-base) var(--cf-ease-standard);
        }
        .game-card:hover, .game-card:focus-visible { transform: translateY(-3px); border-color: var(--cf-border-medium); }
    </style>
</head>
<body>
    <div class="launcher">
        <div class="launcher-top">
            <div class="launcher-brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v4M12 11L6.5 17M12 11l5.5 6"/></svg>
                <span data-i18n="BRAND">COGNIFIT MICROGAMES</span>
            </div>
            <div class="cf-lang-switcher">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span class="cf-lang-current">EN</span>
                <select class="cf-lang-select" data-i18n-aria="LANGUAGE_SELECT_LABEL" aria-label="Change language"></select>
            </div>
        </div>
        <h1 class="cf-game-title" data-i18n="CHOOSE_A_GAME">Choose a game</h1>
        <p class="cf-game-subtitle" data-i18n="PICK_ONE_TO_START">Pick one to start playing</p>

        <div class="launcher-grid" id="launcher-grid"></div>
    </div>

    <script src="languages.js"></script>
    <script src="utils.js"></script>
    <script src="main.js"></script>
    <script>
        const grid = document.getElementById('launcher-grid');
        window.games.forEach(game => {
            const link = document.createElement('a');
            link.className = 'game-card';
            link.href = `${game.id}/index.html`;
            link.innerText = game.name;
            grid.appendChild(link);
        });

        (async function() {
            const languageKey = Utils.getPreferredLanguage('en_US');
            const lb = await Utils.loadLanguageBundle('', languageKey);
            Utils.applyLocalization(lb);
            Utils.setupLanguageSwitcher(languageKey, async (newKey) => {
                const newLb = await Utils.loadLanguageBundle('', newKey);
                Utils.applyLocalization(newLb);
                Utils.setPreferredLanguage(newKey);
                Utils.syncLanguageSwitcher(newKey);
            });
        })();
    </script>
</body>
</html>
